<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job tracker — sign in</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --border:#2a2f3a;
          --text:#e6e9ef; --muted:#9aa3b2; --accent:#6ea8fe; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:var(--panel); border:1px solid var(--border);
          border-radius:12px; padding:28px; width:min(340px, 90vw); }
  h1 { font-size:16px; margin:0 0 4px; }
  p  { color:var(--muted); margin:0 0 16px; font-size:13px; }
  input[type=password] { width:100%; background:var(--panel2); border:1px solid var(--border);
          color:var(--text); border-radius:6px; padding:10px 12px; font-size:14px; }
  input[type=password]:focus { outline:1px solid var(--accent); }
  button { width:100%; margin-top:12px; background:var(--accent); border:none;
           color:#06101f; font-weight:600; border-radius:6px; padding:10px;
           font-size:14px; cursor:pointer; }
  .err { color:var(--bad); font-size:13px; margin-top:10px; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Job application tracker</h1>
    <p>Enter the password you were given.</p>
    <input type="password" name="password" placeholder="password" autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
